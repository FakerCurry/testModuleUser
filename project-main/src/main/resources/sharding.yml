# ShardingSphere 5.5 YAML 配置（由 DataSourceConfig 加载）
mode:
  type: Standalone
  repository:
    type: JDBC

dataSources:
  ds0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/ds0?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: Shenjw19931103
    maximumPoolSize: 20
    minimumIdle: 5
  ds1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/ds1?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: Shenjw19931103
    maximumPoolSize: 20
    minimumIdle: 5

rules:
  - !SHARDING
    tables:
      t_user:
        actualDataNodes: ds${0..1}.t_user_${1..2}
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: t_user_inline
        keyGenerateStrategy:
          column: user_id
          keyGeneratorName: snowflake
      t_order:
        actualDataNodes: ds${0..1}.t_order_${1..2}
        tableStrategy:
          standard:
            shardingColumn: order_id
            shardingAlgorithmName: t_order_inline
        keyGenerateStrategy:
          column: order_id
          keyGeneratorName: snowflake
    shardingAlgorithms:
      t_user_inline:
        type: INLINE
        props:
          algorithm-expression: t_user_${user_id % 2 + 1}
      t_order_inline:
        type: INLINE
        props:
          algorithm-expression: t_order_${order_id % 2 + 1}
    keyGenerators:
      snowflake:
        type: SNOWFLAKE

props:
  sql-show: true
